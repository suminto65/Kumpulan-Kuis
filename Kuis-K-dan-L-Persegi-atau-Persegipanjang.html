<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis Matematika – Keliling dan Luas Persegi atau Persegipanjang</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css"><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script><script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script><style>body{font:16px/1.6 system-ui,sans-serif;background:#eef3f2;margin:0;color:#1f2937}#app{max-width:760px;margin:auto;padding:16px}h1{color:#0f766e;margin:0}.m{color:#64748b;margin:2px 0 12px}#top{display:flex;gap:10px;align-items:center;position:sticky;top:0;background:#eef3f2;padding:8px 0}#top input{flex:1}input[type=text],input:not([type]),.a{width:100%;padding:8px;border:1px solid #b6c4c2;border-radius:8px;font:inherit}.q{background:#fff;border:2px solid #d5dfdd;border-radius:12px;padding:12px 14px;margin:12px 0}.q.ok{border-color:#16a34a;background:#f0fdf4}.q.no{border-color:#dc2626;background:#fef2f2}.o{display:block;padding:6px 8px;margin:4px 0;border-radius:8px;cursor:pointer}.o:hover{background:#ecf5f3}.ex{font-size:14px;margin-top:6px}button{font:inherit;background:#0f766e;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}</style></head><body><div id="app"></div><script>window.__Q={"title":"Kuis Matematika – Keliling dan Luas Persegi atau Persegipanjang","meta":"SD Kelas 6 • Matematika • Tanpa batas waktu","minutes":0,"info":{"jenjang":"SD","kelas":"6","mapel":"Matematika","tipe":"pg","durasi":0,"materi":"Keliling dan Luas Persegi atau Persegipanjang"},"questions":[{"type":"pg","text":"Sebuah ubin berbentuk persegi memiliki panjang sisi $15\\text{ cm}$. Berapakah keliling ubin tersebut?","explanation":"Keliling persegi dihitung dengan rumus $4 \\times \\text{sisi}$. Jadi, $4 \\times 15\\text{ cm} = 60\\text{ cm}$.","options":["$30\\text{ cm}$","$45\\text{ cm}$","$60\\text{ cm}$","$225\\text{ cm}$"],"answer":2},{"type":"pg","text":"Sebuah lapangan berbentuk persegipanjang mempunyai panjang $25\\text{ m}$ dan lebar $12\\text{ m}$. Berapakah luas lapangan tersebut?","explanation":"Luas persegipanjang dihitung dengan rumus $\\text{panjang} \\times \\text{lebar}$. Jadi, $25\\text{ m} \\times 12\\text{ m} = 300\\text{ m}^2$.","options":["$74\\text{ m}^2$","$300\\text{ m}^2$","$150\\text{ m}^2$","$37\\text{ m}^2$"],"answer":1},{"type":"pg","text":"Jika keliling sebuah persegi adalah $56\\text{ cm}$, berapakah panjang sisi persegi tersebut?","explanation":"Panjang sisi persegi dapat dicari dengan membagi keliling dengan $4$. Jadi, $56\\text{ cm} \\div 4 = 14\\text{ cm}$.","options":["$12\\text{ cm}$","$14\\text{ cm}$","$16\\text{ cm}$","$28\\text{ cm}$"],"answer":1},{"type":"pg","text":"Sebuah kebun berbentuk persegipanjang memiliki luas $120\\text{ m}^2$. Jika panjang kebun adalah $15\\text{ m}$, berapakah lebar kebun tersebut?","explanation":"Lebar persegipanjang dicari dengan rumus $\\text{Luas} \\div \\text{panjang}$. Jadi, $120\\text{ m}^2 \\div 15\\text{ m} = 8\\text{ m}$.","options":["$6\\text{ m}$","$8\\text{ m}$","$10\\text{ m}$","$12\\text{ m}$"],"answer":1},{"type":"pg","text":"Ayah ingin membuat pagar di sekeliling taman berbentuk persegi dengan panjang sisi $8\\text{ m}$. Jika harga kawat pagar Rp10.000,00 per meter, berapa biaya minimal yang diperlukan Ayah?","explanation":"Hitung keliling taman terlebih dahulu: $4 \\times 8\\text{ m} = 32\\text{ m}$. Biaya total adalah $32\\text{ m} \\times \\text{Rp}10.000,00 = \\text{Rp}320.000,00$.","options":["Rp256.000,00","Rp640.000,00","Rp320.000,00","Rp160.000,00"],"answer":2},{"type":"pg","text":"Sebuah taman berbentuk persegipanjang memiliki perbandingan panjang dan lebar adalah $5 : 3$. Jika keliling taman tersebut adalah $64\\text{ m}$, maka luas taman tersebut adalah...","explanation":"Keliling = $2 \\times (p + l) \\Rightarrow 64 = 2 \\times (5x + 3x) \\Rightarrow 32 = 8x \\Rightarrow x = 4$. Panjang = $5(4) = 20\\text{ m}$, Lebar = $3(4) = 12\\text{ m}$. Luas = $20 \\times 12 = 240\\text{ m}^2$.","options":["$240\\text{ m}^2$","$135\\text{ m}^2$","$480\\text{ m}^2$","$960\\text{ m}^2$"],"answer":0},{"type":"pg","text":"Pak Andi ingin membuat pagar keliling sebuah kolam ikan berbentuk persegi. Jika luas kolam ikan tersebut adalah $324\\text{ m}^2$, panjang kawat minimal yang dibutuhkan untuk membuat $3$ lapis pagar keliling kolam adalah...","explanation":"Sisi persegi = $\\sqrt{324} = 18\\text{ m}$. Keliling kolam = $4 \\times 18 = 72\\text{ m}$. Panjang kawat untuk $3$ lapis = $3 \\times 72 = 216\\text{ m}$.","options":["$72\\text{ m}$","$108\\text{ m}$","$216\\text{ m}$","$324\\text{ m}$"],"answer":2},{"type":"pg","text":"Sebuah lantai berbentuk persegipanjang dengan ukuran panjang $6\\text{ m}$ dan lebar $4\\text{ m}$ akan dipasang ubin berbentuk persegi dengan panjang sisi $20\\text{ cm}$. Banyak ubin yang dibutuhkan untuk menutup seluruh lantai adalah...","explanation":"Luas lantai = $600\\text{ cm} \\times 400\\text{ cm} = 240.000\\text{ cm}^2$. Luas 1 ubin = $20\\text{ cm} \\times 20\\text{ cm} = 400\\text{ cm}^2$. Banyak ubin = $240.000 \\div 400 = 600\\text{ ubin}$.","options":["$120\\text{ ubin}$","$300\\text{ ubin}$","$600\\text{ ubin}$","$1.200\\text{ ubin}$"],"answer":2},{"type":"pg","text":"Keliling sebuah persegi sama dengan keliling persegipanjang dengan ukuran panjang $18\\text{ cm}$ dan lebar $12\\text{ cm}$. Luas persegi tersebut adalah...","explanation":"Keliling persegipanjang = $2 \\times (18 + 12) = 2 \\times 30 = 60\\text{ cm}$. Keliling persegi = Keliling persegipanjang = $60\\text{ cm}$. Sisi persegi = $60 \\div 4 = 15\\text{ cm}$. Luas persegi = $15 \\times 15 = 225\\text{ cm}^2$.","options":["$225\\text{ cm}^2$","$400\\text{ cm}^2$","$900\\text{ cm}^2$","$1.296\\text{ cm}^2$"],"answer":0},{"type":"pg","text":"Selembar karton berbentuk persegipanjang memiliki luas $270\\text{ cm}^2$. Jika lebarnya adalah $15\\text{ cm}$, maka keliling karton tersebut adalah...","explanation":"Panjang = $\\text{Luas} \\div \\text{lebar} = 270 \\div 15 = 18\\text{ cm}$. Keliling = $2 \\times (18 + 15) = 2 \\times 33 = 66\\text{ cm}$.","options":["$36\\text{ cm}$","$51\\text{ cm}$","$66\\text{ cm}$","$72\\text{ cm}$"],"answer":2}]};(function runner(){
 const Q=window.__Q,$=s=>document.querySelector(s),L='ABCD';
 const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const nz=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
 let left=Q.minutes*60,tm,done=false;
 const mj=el=>window.renderMathInElement&&renderMathInElement(el||document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
 $('#app').innerHTML='<h1>'+esc(Q.title)+'</h1><p class="m">'+esc(Q.meta)+'</p><div id="top"><input id="nm" placeholder="Nama siswa"><b id="tm"></b></div><div id="qs"></div><button id="fin">Selesai &amp; Lihat Nilai</button><div id="res"></div>';
 $('#qs').innerHTML=Q.questions.map((q,i)=>{
  let h='<div class="q" id="q'+i+'"><p><b>'+(i+1)+'.</b> '+esc(q.text)+'</p>';
  if(q.type=='is')h+='<input class="a" data-i="'+i+'" placeholder="Jawaban singkat">';
  else{h+=(q.type=='pk'?'<small>Pilih semua jawaban yang benar.</small>':'');
   q.options.forEach((o,k)=>{h+='<label class="o"><input type="'+(q.type=='pk'?'checkbox':'radio')+'" name="r'+i+'" value="'+k+'"> '+L[k]+'. '+esc(o)+'</label>'});}
  return h+'<div class="ex" id="e'+i+'"></div></div>'}).join('');
 function tick(){const m=Math.floor(left/60),s=left%60;$('#tm').textContent='⏱ '+m+':'+String(s).padStart(2,'0');if(left--<=0)finish()}
 if(Q.minutes>0){tick();tm=setInterval(tick,1000)}
 addEventListener('load',()=>mj());mj();
 function finish(){
  if(done)return;done=true;clearInterval(tm);let ok=0;
  Q.questions.forEach((q,i)=>{
   const box=$('#q'+i);let right=false,ans='';
   if(q.type=='is'){const v=nz(box.querySelector('.a').value);right=[q.answer].concat(q.alt||[]).some(a=>nz(a)==v&&v);ans=q.answer}
   else{const got=[...box.querySelectorAll('input:checked')].map(x=>+x.value).sort().join();
    const key=(q.type=='pg'?[q.answer]:q.answers).slice().sort().join();right=got==key;
    ans=(q.type=='pg'?[q.answer]:q.answers).map(k=>L[k]).join(', ')}
   if(right)ok++;box.classList.add(right?'ok':'no');
   $('#e'+i).innerHTML=(right?'✔ Benar':'✘ Salah')+' — Kunci: <b>'+esc(ans)+'</b>'+(q.explanation?'<br><i>'+esc(q.explanation)+'</i>':'');mj($('#e'+i));
   box.querySelectorAll('input').forEach(x=>x.disabled=true)});
  const n=Math.round(ok/Q.questions.length*100);
  $('#res').innerHTML='<h2>Nilai: '+n+'</h2><p>'+esc($('#nm').value||'(tanpa nama)')+' — benar '+ok+' dari '+Q.questions.length+'</p><button onclick="print()">Cetak hasil</button>';
  $('#fin').style.display='none';$('#res').scrollIntoView({behavior:'smooth'})}
 $('#fin').onclick=()=>{if(confirm('Selesaikan kuis sekarang?'))finish()};
})()</script></body></html>
