<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuis Matematika</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@700&display=swap" rel="stylesheet">
<style>
:root{--acc:#14284B;--brass:#B8892B;--bg:#F5F6FA;--card:#fff;--ink:#1B2233;--mut:#5E6880;--line:#DDE1EC}
@media(prefers-color-scheme:dark){:root{--acc:#3A5FA8;--bg:#0F1626;--card:#18223A;--ink:#E8ECF5;--mut:#9AA5BD;--line:#2A3552}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.w{max-width:960px;margin:0 auto;padding:0 16px}
header{background:#14284B;color:#fff;padding:28px 0 22px;border-bottom:4px solid var(--brass)}
h1{font:700 clamp(26px,6vw,38px)/1.15 'Source Serif 4',Georgia,serif;margin:0 0 4px}
header p{margin:0 0 16px;color:#C9D3E8}
#q{width:100%;padding:12px 14px;border:0;border-radius:8px;font:inherit}
button,a.go{font:600 15px system-ui,sans-serif;cursor:pointer}
button:focus-visible,a:focus-visible,#q:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
#tabs{display:flex;gap:8px;margin:18px 0 10px}
#tabs button{flex:1;min-width:0;padding:12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
#chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
#chips button{padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink)}
button.on{background:var(--acc)!important;color:#fff!important;border-color:var(--acc)!important}
#info{color:var(--mut);margin:12px 0}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:40px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.k h3{margin:0;font-size:17px;line-height:1.3}
.k small{color:var(--mut)}
.b{align-self:flex-start;background:var(--brass);color:#1B1300;font:700 12px system-ui;padding:2px 8px;border-radius:99px}
a.go{margin-top:auto;display:block;text-align:center;text-decoration:none;background:var(--acc);color:#fff;padding:10px;border-radius:8px}
.empty{grid-column:1/-1;color:var(--mut);padding:24px 0}
</style></head><body>
<header><div class="w">
<h1>Kuis Matematika</h1>
<p>Pilih jenjang dan kelas, lalu buka kuisnya.</p>
<input id="q" type="search" placeholder="Cari judul kuis di semua kelas" aria-label="Cari kuis">
</div></header>
<main class="w">
<div id="tabs"></div><div id="chips"></div>
<div id="info"></div><div id="list"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tgl=t=>t?new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'';
let D=[],J,K;
fetch('kuis.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d.jenjang;route()})
 .catch(()=>{$('#list').innerHTML='<p class="empty">Data kuis belum bisa dimuat. Pastikan kuis.json ada di folder yang sama dan halaman dibuka lewat alamat web, bukan langsung dari file.</p>'});
function route(){
 const h=location.hash.slice(1),i=h.indexOf('-'),j=i<0?h:h.slice(0,i),k=i<0?'':h.slice(i+1);
 J=D.find(x=>x.id==j)||D[0];K=J.kelas.find(x=>x.id==k)||J.kelas[0];draw();
}
function draw(){
 const q=$('#q').value.trim().toLowerCase();
 $('#tabs').innerHTML=D.map(j=>`<button class="${j==J?'on':''}" data-j="${esc(j.id)}">${esc(j.nama)}</button>`).join('');
 $('#chips').innerHTML=q?'':J.kelas.map(k=>`<button class="${k==K?'on':''}" data-k="${esc(k.id)}">${esc(k.nama)}</button>`).join('');
 const all=q?D.flatMap(j=>j.kelas.flatMap(k=>k.kuis.map(z=>({...z,w:j.nama+', '+k.nama})))):K.kuis.map(z=>({...z,w:''}));
 const L=all.filter(z=>!q||(z.judul+' '+(z.bab||'')).toLowerCase().includes(q)).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));
 $('#info').textContent=q?`${L.length} hasil untuk “${$('#q').value.trim()}”`:`${J.nama}, ${K.nama}: ${L.length} kuis`;
 $('#list').innerHTML=L.length?L.map(z=>{
  const baru=z.tanggal&&Date.now()-new Date(z.tanggal)<14*864e5;
  const meta=[z.w,z.bab,z.jumlahSoal?z.jumlahSoal+' soal':'',tgl(z.tanggal)].filter(Boolean).join(', ');
  return `<article class="k">${baru?'<span class="b">Baru</span>':''}<h3>${esc(z.judul)}</h3><small>${esc(meta)}</small><a class="go" href="${esc(z.url)}" target="_blank" rel="noopener">Buka kuis</a></article>`;
 }).join(''):`<p class="empty">${q?'Tidak ada kuis dengan kata itu.':'Belum ada kuis di kelas ini. Cek lagi nanti.'}</p>`;
}
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-j],button[data-k]');if(!b)return;
 $('#q').value='';
 if(b.dataset.j){const j=D.find(x=>x.id==b.dataset.j);location.hash=j.id+'-'+j.kelas[0].id}
 else location.hash=J.id+'-'+b.dataset.k;
 if(!D.length)return;route();
});
$('#q').addEventListener('input',draw);
addEventListener('hashchange',()=>D.length&&route());
</script></body></html>
